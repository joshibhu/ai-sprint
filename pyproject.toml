[project]
name = "sprint"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "openai>=3.14.1",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.19.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
sprint = "sprint.__main__:main"

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "reportlab>=5.0.1",
]

[tool.pytest.ini_options]
# `tests` on the path so conftest helpers import cleanly; `-q` for quiet output.
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["tests"]
markers = [
    "integration: needs a running database (docker compose up -d)",
]
